# Server
server.port=8000
spring.application.name=webapi
spring.threads.virtual.enabled=true

# Database
spring.datasource.url=YOUR_DB_URL
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.hikari.pool-name=RoomRentalHikariPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.hibernate.ddl-auto=validate

# Audit log
audit.enabled=true
audit.queue.capacity=5000
audit.queue.worker-count=2
audit.queue.enqueue-timeout-ms=0
audit.batch.enabled=true
audit.batch.size=100
audit.batch.flush-interval-ms=1000
audit.retry.max-attempts=3
audit.retry.initial-delay-ms=500
audit.retry.max-delay-ms=5000
audit.retry.multiplier=2.0
audit.shutdown.timeout-seconds=30
audit.excluded-fields=createdAt,updatedAt,createdBy,updatedBy
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=100

# P6Spy Configuration
decorator.datasource.p6spy.enable-logging=true
decorator.datasource.p6spy.logging=slf4j
decorator.datasource.p6spy.multiline=false
decorator.datasource.p6spy.log-format=%(executionTime)ms | %(category) | %(sqlSingleLine)
decorator.datasource.p6spy.exclude-categories=info,debug,result,resultset,batch

# Logging Configuration
logging.pattern.level=%5p [requestId=%X{requestId:-} clientActionId=%X{clientActionId:-} clientRequestId=%X{clientRequestId:-}]
logging.level.p6spy=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
spring.jpa.show-sql=false

# Open API Documents
# Set all below to false in production
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
